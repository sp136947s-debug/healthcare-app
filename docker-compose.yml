services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nidan
      POSTGRES_PASSWORD: nidan
      POSTGRES_DB: nidan
    ports:
      - "5432:5432"
    volumes:
      - nidan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nidan -d nidan"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://nidan:nidan@db:5432/nidan
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  nidan_pgdata:
